# Redis is used in development too so that broadcasts made from other processes
# (e.g. `bin/rails demo:market`, a console session) reach connected browsers.
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: landchecker_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: landchecker_production
