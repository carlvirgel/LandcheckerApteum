default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  # Puma threads + ActionCable worker pool share this pool
  max_connections: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 } %>

development:
  <<: *default
  database: landchecker_development

test:
  <<: *default
  database: landchecker_test

# In production DATABASE_URL takes precedence over everything above.
production:
  <<: *default
  database: landchecker_production
  url: <%= ENV["DATABASE_URL"] %>
